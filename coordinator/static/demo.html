<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rtc-bridge demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 2rem max(2rem, calc(50vw - 280px));
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      padding-right: 0.02em;
      background: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-link { text-decoration: none; cursor: pointer; -webkit-text-fill-color: transparent; }

    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    input[type=text] {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
      padding: 0.4rem 0.75rem;
      width: 280px;
      outline: none;
    }
    input[type=text]:focus { border-color: #58a6ff; }

    button {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.4rem 0.9rem;
      white-space: nowrap;
    }
    button:hover { background: #30363d; border-color: #58a6ff66; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #1f6feb; border-color: #388bfd; color: #fff; }
    button.primary:hover { background: #388bfd; }
    button.danger { border-color: #f8514966; color: #f85149; }
    button.danger:hover { background: #f8514922; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      padding: 0.3rem 0.75rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .chip:hover { border-color: #58a6ff; background: #1c2128; }
    .chip.active { border-color: #58a6ff; background: #1c2128; }
    .chip .svc-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3fb950;
    }

    .node-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .node-id {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 0.78rem;
      color: #8b949e;
      user-select: all;
    }

    .section-label {
      font-size: 0.72rem;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.25rem;
    }

    .repl {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .repl-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .result {
      font-size: 0.83rem;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      color: #8b949e;
    }
    .result:empty { display: none; }
    .result.ok  { color: #3fb950; }
    .result.err { color: #f85149; }

    .service-panel {
      background: #0d1117;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
    }
    .panel-header .section-label { margin-bottom: 0; }

    .term-log {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 0.82rem;
      min-height: 0;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .term-line { white-space: pre-wrap; word-break: break-all; }
    .term-line.sent { color: #58a6ff; }
    .term-line.recv { color: #e6edf3; }
    .term-line.info { color: #6e7681; font-style: italic; }

    .term-input-row { display: flex; gap: 0.4rem; }
    .term-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 0.82rem;
      padding: 0.3rem 0.6rem;
      outline: none;
    }
    .term-input:focus { border-color: #58a6ff; }

    .err-msg {
      color: #f85149;
      font-size: 0.83rem;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1><a class="home-link" href="/">rtc-bridge</a> demo</h1>

  <!-- Step 1: coordinator URL -->
  <div class="row" id="step1">
    <input type="text" id="coord-url" placeholder="coordinator URL">
    <button class="primary" onclick="fetchNodes()">Connect</button>
    <span class="err-msg" id="err1"></span>
  </div>

  <!-- Step 2: node list -->
  <div id="step2" hidden>
    <div class="section-label">Nodes</div>
    <div class="row" id="node-list" style="gap:0.75rem;margin-top:0.4rem"></div>
  </div>

  <!-- Panels: node REPL + service bridges, appended dynamically -->
  <div id="panels" style="display:flex;flex-direction:column;gap:1.5rem"></div>

  <script type="module">
    import { Coordinator, dial } from '/rtc-bridge.js';

    let coordinator = null;

    // ── Step 1: fetch nodes ────────────────────────────────────────────────
    window.fetchNodes = async () => {
      const url = document.getElementById('coord-url').value.trim();
      const err = document.getElementById('err1');
      err.textContent = '';
      try {
        coordinator = new Coordinator(url);
        const nodes = await coordinator.nodes();
        renderNodes(nodes);
        show('step2');
      } catch(e) {
        err.textContent = String(e);
      }
    };

    function renderNodes(nodes) {
      const list = document.getElementById('node-list');
      list.innerHTML = '';
      if (!nodes || nodes.length === 0) {
        list.textContent = 'No nodes connected.';
        return;
      }
      for (const n of nodes) {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <div class="node-id">${n.nodeId}</div>
          <div class="row" style="gap:0.3rem"></div>`;
        card.onclick = () => openNodePanel(n.nodeId);
        const chips = card.querySelector('.row');
        for (const svc of (n.services || [])) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `<span class="svc-dot"></span>${svc}`;
          chip.onclick = (e) => { e.stopPropagation(); openBridgePanel(n.nodeId, svc); };
          chips.appendChild(chip);
        }
        list.appendChild(card);
      }
    }

    // ── Panel creation ─────────────────────────────────────────────────────
    // Card click → new REPL panel. Service panels are nested children.
    async function openNodePanel(nodeId) {
      const panel = document.createElement('div');
      panel.className = 'repl';
      const statusLabel = document.createElement('div');
      statusLabel.className = 'section-label';
      statusLabel.textContent = 'Connecting to';
      const idEl = document.createElement('div');
      idEl.className = 'node-id';
      idEl.textContent = nodeId;
      const result = document.createElement('div');
      result.className = 'result';
      result.textContent = 'Connecting…';
      panel.append(statusLabel, idEl, result);
      document.getElementById('panels').appendChild(panel);

      let node, cmdCh;
      try {
        node = await dial(coordinator, nodeId);
        cmdCh = await node.createChannel();
      } catch(e) {
        result.textContent = String(e);
        result.className = 'result err';
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.style.marginTop = '0.5rem';
        btn.textContent = '×';
        btn.onclick = () => panel.remove();
        panel.appendChild(btn);
        return;
      }

      panel.innerHTML = '';
      statusLabel.textContent = 'Connected to';
      panel.append(statusLabel, idEl);

      const setResult = (text, cls) => {
        result.textContent = text;
        result.className = 'result' + (cls ? ' ' + cls : '');
      };
      result.textContent = '';

      const svcChips = document.createElement('div');
      svcChips.className = 'row';
      svcChips.style.cssText = 'gap:0.3rem;flex-wrap:wrap';

      // Container for nested service panels
      const svcPanels = document.createElement('div');
      svcPanels.style.cssText = 'display:flex;flex-direction:column;gap:0.75rem;margin-top:0.25rem';

      const actions = document.createElement('div');
      actions.className = 'repl-actions';

      const mkBtn = (label, cls, fn) => {
        const b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        b.onclick = fn;
        actions.appendChild(b);
      };

      mkBtn('Ping', '', async () => {
        setResult('…', '');
        try { setResult(`pong  ${await cmdCh.ping()} ms`, 'ok'); }
        catch(e) { setResult(String(e), 'err'); }
      });
      mkBtn('List services', '', async () => {
        setResult('…', '');
        try {
          const svcs = await cmdCh.list();
          setResult('', '');
          svcChips.innerHTML = '';
          for (const svc of svcs) {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = `<span class="svc-dot"></span>${svc}`;
            chip.onclick = () => openServicePanel(node, svcPanels, svc);
            svcChips.appendChild(chip);
          }
        } catch(e) { setResult(String(e), 'err'); }
      });
      mkBtn('Verify node', '', async () => {
        setResult('Verifying…', '');
        try {
          const r = await cmdCh.verifyIdentity();
          setResult(r.ok ? `✓ verified  ${r.pubkey.slice(0,16)}…` : `✗ ${r.message}`, r.ok ? 'ok' : 'err');
        } catch(e) { setResult(String(e), 'err'); }
      });
      mkBtn('Disconnect', 'danger', () => { node.close(); panel.remove(); });

      panel.append(actions, result, svcChips, svcPanels);
      node.pc.addEventListener('connectionstatechange', () => {
        if (node.pc.connectionState === 'closed' || node.pc.connectionState === 'failed') {
          panel.remove();
        }
      });
    }

    // Chip click from node list → new independent connection + bridge.
    async function openBridgePanel(nodeId, svc) {
      const panel = document.createElement('div');
      panel.className = 'repl service-panel';
      const label = document.createElement('div');
      label.className = 'section-label';
      label.style.marginBottom = '0.3rem';
      label.textContent = `Connecting to ${svc}…`;
      panel.appendChild(label);
      document.getElementById('panels').appendChild(panel);

      let node, ch;
      try {
        node = await dial(coordinator, nodeId);
        ch = await node.createChannel();
        await ch.connect(svc);
      } catch(e) {
        label.textContent = String(e);
        label.style.color = '#f85149';
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.style.marginTop = '0.5rem';
        btn.textContent = '×';
        btn.onclick = () => panel.remove();
        panel.appendChild(btn);
        return;
      }
      addTerminal(ch.dc, svc, label, panel, () => { node.close(); panel.remove(); });
    }

    // Service chip from REPL list → sibling DC on same PC, nested inside node panel.
    async function openServicePanel(node, container, svc) {
      const panel = document.createElement('div');
      panel.className = 'service-panel';
      const label = document.createElement('div');
      label.className = 'section-label';
      label.style.marginBottom = '0.3rem';
      label.textContent = `Connecting to ${svc}…`;
      panel.appendChild(label);
      container.appendChild(panel);

      let ch;
      try {
        ch = await node.createChannel();
        await ch.connect(svc);
      } catch(e) {
        label.textContent = String(e);
        label.style.color = '#f85149';
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.style.marginTop = '0.5rem';
        btn.textContent = '×';
        btn.onclick = () => panel.remove();
        panel.appendChild(btn);
        return;
      }
      addTerminal(ch.dc, svc, label, panel, () => { ch.close(); panel.remove(); });
    }

    function addTerminal(dc, svc, label, panel, onClose) {
      // Replace placeholder label with header row (label + close button)
      const header = document.createElement('div');
      header.className = 'panel-header';
      label.textContent = svc;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'danger';
      closeBtn.textContent = '×';
      closeBtn.onclick = onClose;
      header.append(label, closeBtn);
      panel.appendChild(header);

      const log = document.createElement('div');
      log.className = 'term-log';
      panel.appendChild(log);

      const inputRow = document.createElement('div');
      inputRow.className = 'term-input-row';

      const input = document.createElement('input');
      input.className = 'term-input';
      input.placeholder = 'send…';
      inputRow.appendChild(input);

      const sendBtn = document.createElement('button');
      sendBtn.textContent = 'Send';
      const doSend = () => {
        const text = input.value;
        if (!text) return;
        input.value = '';
        panelLine(log, 'sent', text);
        dc.send(text + '\n');
      };
      sendBtn.onclick = doSend;
      input.addEventListener('keydown', e => { if (e.key === 'Enter') doSend(); });
      inputRow.appendChild(sendBtn);

      panel.appendChild(inputRow);

      dc.addEventListener('message', (e) => {
        const text = typeof e.data === 'string' ? e.data : new TextDecoder().decode(e.data);
        panelLine(log, 'recv', text);
      });
      dc.addEventListener('close', () => panel.remove());

      panelLine(log, 'info', '— bridged —');
      input.focus();
    }

    function panelLine(log, cls, text) {
      const div = document.createElement('div');
      div.className = `term-line ${cls}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function show(id) { document.getElementById(id).hidden = false; }

    // Set default coordinator URL from current host
    document.getElementById('coord-url').value =
      location.protocol + '//' + location.host;
  </script>
</body>
</html>
