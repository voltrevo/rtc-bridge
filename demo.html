<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>webrtc-forward</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      font-size: 0.9rem;
      color: #7c85a6;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header strong { color: #e2e8f0; }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4a5070; flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.connecting { background: #f59e0b; }
    #status-dot.open       { background: #22c55e; }
    #status-dot.closed     { background: #ef4444; }

    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Main panel ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      gap: 20px;
    }

    .step { width: 100%; max-width: 520px; }
    .step h2 {
      font-size: 0.75rem;
      margin-bottom: 6px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .step p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 14px; }

    label { font-size: 0.8rem; color: #64748b; display: block; margin-bottom: 4px; }

    input[type=text] {
      width: 100%;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
    }
    input[type=text]:focus { border-color: #6366f1; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.45; cursor: default; }
    .btn-primary   { background: #6366f1; color: #fff; }
    .btn-secondary { background: #2d3148; color: #e2e8f0; }

    /* Service chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    /* Chat */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 520px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.82rem;
      line-height: 1.6;
    }
    .msg-out { color: #818cf8; }
    .msg-in  { color: #34d399; }
    #chat-input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 520px;
    }
    #chat-input {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 0;
    }
    #chat-input:focus { border-color: #6366f1; }

    /* ── Log panel ── */
    #log-panel {
      width: 280px;
      flex-shrink: 0;
      background: #1a1d27;
      border-left: 1px solid #2d3148;
      display: flex;
      flex-direction: column;
    }
    #log-panel header {
      font-size: 0.72rem;
      color: #7c85a6;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #2d3148;
    }
    #log-entries {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-entry {
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.4;
      color: #64748b;
    }
    .log-entry .ts { color: #374151; margin-right: 6px; }
    .log-entry.info  .msg { color: #94a3b8; }
    .log-entry.ok    .msg { color: #22c55e; }
    .log-entry.warn  .msg { color: #f59e0b; }
    .log-entry.error .msg { color: #ef4444; }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <strong>webrtc-forward</strong>
  <span id="status-text">not connected</span>
</header>

<div class="layout">
  <div id="main">

    <!-- Step 1: coordinator URL -->
    <div class="step" id="step1">
      <h2>Step 1 — Connect to coordinator</h2>
      <p>Enter the coordinator URL to discover available services.</p>
      <label>Coordinator URL:</label>
      <input id="coord-url" type="text" placeholder="http://localhost:8765" autocomplete="off">
      <button class="btn-primary" id="btn-fetch">Fetch Services</button>
    </div>

    <!-- Step 2: select service -->
    <div class="step" id="step2" style="display:none">
      <h2>Step 2 — Select service</h2>
      <p>Click a service to connect. WebRTC negotiation happens automatically.</p>
      <div class="chips" id="service-chips"></div>
    </div>

    <!-- Chat -->
    <div id="step-chat" style="display:none;flex:1;width:100%;max-width:520px;flex-direction:column;gap:10px">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Type a message and press Enter…" autocomplete="off">
        <button class="btn-primary" id="btn-send">Send</button>
      </div>
    </div>

  </div>

  <!-- Log panel -->
  <div id="log-panel">
    <header>Event log</header>
    <div id="log-entries"></div>
  </div>
</div>

<script>
  // ── Logging ────────────────────────────────────────────────────────────────
  function log(msg, level = 'info') {
    const el = document.getElementById('log-entries');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + level;
    const ts = new Date().toTimeString().slice(0, 8);
    entry.innerHTML = `<span class="ts">${ts}</span><span class="msg">${escHtml(msg)}</span>`;
    el.appendChild(entry);
    el.scrollTop = el.scrollHeight;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setStatus(state, text) {
    document.getElementById('status-dot').className = state;
    document.getElementById('status-text').textContent = text;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let pc, dc;
  let coordServices = {}; // { svcName: [nodeId, ...] }

  // ── Step 1: fetch services ─────────────────────────────────────────────────
  document.getElementById('btn-fetch').onclick = async () => {
    const base = document.getElementById('coord-url').value.trim().replace(/\/$/, '');
    if (!base) { log('Enter a coordinator URL', 'warn'); return; }
    log('Fetching services from ' + base + '…');
    document.getElementById('btn-fetch').disabled = true;
    try {
      const resp = await fetch(base + '/services');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      coordServices = await resp.json();
      const names = Object.keys(coordServices).sort();
      log('Services: ' + (names.join(', ') || 'none'), names.length ? 'ok' : 'warn');
      const chips = document.getElementById('service-chips');
      chips.innerHTML = '';
      if (names.length === 0) {
        chips.innerHTML = '<span style="color:#64748b;font-size:0.85rem">No services registered.</span>';
      } else {
        names.forEach(name => {
          const btn = document.createElement('button');
          btn.className = 'btn-secondary';
          btn.textContent = name;
          btn.onclick = () => connect(base, name);
          chips.appendChild(btn);
        });
      }
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    } catch (e) {
      log('Failed to fetch services: ' + e.message, 'error');
      document.getElementById('btn-fetch').disabled = false;
    }
  };

  // ── Step 2: connect to service ─────────────────────────────────────────────
  async function connect(coordBase, svcName) {
    document.querySelectorAll('#service-chips button').forEach(b => b.disabled = true);

    const nodeIds = coordServices[svcName];
    if (!nodeIds || nodeIds.length === 0) {
      log('No nodes for service ' + svcName, 'error');
      document.querySelectorAll('#service-chips button').forEach(b => b.disabled = false);
      return;
    }
    const nodeId = nodeIds[0];
    log('Connecting to "' + svcName + '" via node ' + nodeId + '…');

    try {
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        log('Connection state: ' + s, s === 'connected' ? 'ok' : s === 'failed' ? 'error' : 'info');
        if (s === 'connected') setStatus('open', 'connected');
        if (s === 'disconnected' || s === 'failed') setStatus('closed', s);
      };

      dc = pc.createDataChannel('forward', { ordered: true });

      // Create offer and gather ICE.
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      log('Gathering ICE candidates…');
      setStatus('connecting', 'gathering ICE…');
      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') { resolve(); return; }
        pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') resolve(); };
      });

      // Post offer to coordinator.
      log('Posting offer to coordinator…');
      const resp = await fetch(coordBase + '/offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ service: svcName, nodeId, offer: pc.localDescription }),
      });
      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error('coordinator /offer: HTTP ' + resp.status + ' — ' + txt.trim());
      }
      const answer = await resp.json();
      await pc.setRemoteDescription(answer);
      log('Remote description set — waiting for data channel…');
      setStatus('connecting', 'connecting…');

      // Wait for DC open.
      await new Promise((resolve, reject) => {
        if (dc.readyState === 'open') { resolve(); return; }
        dc.onopen = resolve;
        dc.onerror = e => reject(e.error ?? new Error('DC error'));
      });
      log('Data channel open — handshaking…', 'ok');

      // Send service name, await "ok".
      await new Promise((resolve, reject) => {
        dc.send(svcName);
        dc.onmessage = e => {
          const raw = typeof e.data === 'string' ? e.data : new TextDecoder().decode(e.data);
          if (raw === 'ok') resolve();
          else reject(new Error(raw));
        };
      });

      log('Connected to "' + svcName + '"', 'ok');
      setStatus('open', 'connected');
      activateChat();
      document.getElementById('step2').style.display = 'none';
      const chat = document.getElementById('step-chat');
      chat.style.display = 'flex';
      chat.style.flexDirection = 'column';
      chat.style.flex = '1';
      document.getElementById('main').style.justifyContent = 'flex-start';
      document.getElementById('chat-input').focus();
    } catch (e) {
      log('Connect failed: ' + e.message, 'error');
      setStatus('closed', 'error');
      document.querySelectorAll('#service-chips button').forEach(b => b.disabled = false);
    }
  }

  // ── Chat ───────────────────────────────────────────────────────────────────
  function activateChat() {
    dc.onmessage = e => {
      const raw = typeof e.data === 'string' ? e.data : new TextDecoder().decode(e.data);
      const msgs = document.getElementById('chat-messages');
      const line = document.createElement('div');
      line.className = 'msg-in';
      line.textContent = '← ' + raw.replace(/\r?\n$/, '');
      msgs.appendChild(line);
      msgs.scrollTop = msgs.scrollHeight;
    };
    dc.onclose = () => { log('Data channel closed', 'warn'); setStatus('closed', 'disconnected'); };
    dc.onerror = e => log('Data channel error: ' + (e.error?.message ?? e), 'error');
  }

  function sendMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !dc || dc.readyState !== 'open') return;
    dc.send(text + '\n');
    const msgs = document.getElementById('chat-messages');
    const line = document.createElement('div');
    line.className = 'msg-out';
    line.textContent = '→ ' + text;
    msgs.appendChild(line);
    msgs.scrollTop = msgs.scrollHeight;
    input.value = '';
  }

  document.getElementById('btn-send').onclick = sendMsg;
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });
</script>
</body>
</html>
